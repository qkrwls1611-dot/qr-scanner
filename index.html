<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>통합 QR 자동 스캐너</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6fa;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif}
    .header{padding:20px 18px 26px;background:#e53935;color:#fff}
    .header h1{margin:0;font-size:22px}
    .header p{margin:7px 0 0;font-size:13px;opacity:.9}
    .content{max-width:560px;margin:-10px auto 0;padding:0 14px 28px}
    .card{margin-bottom:13px;padding:16px;border-radius:17px;background:#fff;box-shadow:0 7px 20px rgba(0,0,0,.06)}
    .type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
    .type-button{min-height:43px;border:1px solid #ddd;border-radius:11px;background:#fff;font-weight:900}
    .type-button.active{border-color:#e53935;background:#e53935;color:#fff}
    .camera-row{display:flex;gap:8px;margin-bottom:10px}
    .camera-switch{width:100%;height:42px;border:1px solid #ddd;border-radius:10px;background:#fff;font-weight:800}
    .video-wrap{position:relative;overflow:hidden;border-radius:14px;background:#111;aspect-ratio:3/4}
    video{width:100%;height:100%;object-fit:cover;transform:none!important;-webkit-transform:none!important}
    .guide{position:absolute;left:50%;top:50%;width:64%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.22);pointer-events:none}
    .status{margin-top:11px;padding:13px;border-radius:12px;text-align:center;font-size:14px;line-height:1.5;background:#f7f8fa}
    .success{background:#eefaf1;color:#2e7d32}
    .error{background:#fff1f1;color:#c62828}
    .student-name{font-size:21px;font-weight:900}
    .small{margin-top:8px;color:#777;text-align:center;font-size:12px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <header class="header">
    <h1>통합 QR 자동 출석</h1>
    <p>QR을 화면 중앙에 가져다 대면 바로 처리됩니다.</p>
  </header>

  <main class="content">
    <section class="card">
      <div class="type-grid">
        <button class="type-button active" data-type="입실">입실</button>
        <button class="type-button" data-type="외출">외출</button>
        <button class="type-button" data-type="복귀">복귀</button>
        <button class="type-button" data-type="퇴실">퇴실</button>
      </div>

      <div class="camera-row">
        <button id="switchCameraBtn" class="camera-switch" type="button">🔄 카메라 전환</button>
      </div>

      <div class="video-wrap">
        <video id="video" playsinline muted></video>
        <div class="guide"></div>
      </div>

      <div id="status" class="status">후면 카메라를 시작하는 중입니다.</div>
      <div class="small">후면 카메라 우선 · 중앙 영역 고속 스캔</div>
      <canvas id="canvas" hidden></canvas>
    </section>
  </main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzoApn9Z8PK3Gbk16yINX_5zrYf2N0uyn4TA20iZXaSmzEG0HDx8OEQRpvO1WGMgWxs/exec";
const SCANNER_KEY = "00b63e24-0f8c-4f3a-b34a-246fa64efa9692df311f-a87e-4a81-bf4c-6e31dc9d0259";

let selectedType = "입실";
let stream = null;
let processing = false;
let lastToken = "";
let lastProcessedAt = 0;
let lastScanAt = 0;
let useBackCamera = true;
const SCAN_INTERVAL = 120;

document.querySelectorAll(".type-button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".type-button").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    selectedType = btn.dataset.type;
  });
});

document.getElementById("switchCameraBtn").addEventListener("click", async () => {
  useBackCamera = !useBackCamera;
  await startCamera();
});

async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  setStatus((useBackCamera ? "후면" : "전면") + " 카메라를 시작하는 중입니다.", "");

  try {
    const video = document.getElementById("video");
    let constraints = {
      video: {
        facingMode: { exact: useBackCamera ? "environment" : "user" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    };

    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (e) {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: useBackCamera ? "environment" : "user" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
    }

    video.srcObject = stream;
    await video.play();

    setStatus(
      (useBackCamera ? "후면 카메라" : "전면 카메라") +
      " 사용 중 · QR을 중앙에 가져다 대세요.",
      ""
    );

    requestAnimationFrame(scanFrame);
  } catch (err) {
    setStatus(
      "카메라를 열 수 없습니다: " + (err.message || err.name || err),
      "error"
    );
  }
}

function scanFrame(timestamp) {
  requestAnimationFrame(scanFrame);

  if (timestamp - lastScanAt < SCAN_INTERVAL) return;
  lastScanAt = timestamp;

  const video = document.getElementById("video");
  if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) return;

  const cropSize = Math.floor(Math.min(vw, vh) * 0.70);
  const sx = Math.floor((vw - cropSize) / 2);
  const sy = Math.floor((vh - cropSize) / 2);

  const target = Math.min(640, cropSize);
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", {willReadFrequently:true});

  canvas.width = target;
  canvas.height = target;
  ctx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, target, target);

  const imageData = ctx.getImageData(0, 0, target, target);
  const qr = jsQR(
  imageData.data,
  target,
  target,
  { inversionAttempts: "dontInvert" }
);

if (!qr || !qr.data) return;

const now = Date.now();

if (
  qr.data === lastToken &&
  now - lastProcessedAt < 2500
) return;

// QR 인식 성공 → 삑 소리
playScanSound();

processToken(qr.data);
}
function processToken(token) {
  lastToken = token;
  lastProcessedAt = Date.now();

  // QR 읽자마자 바로 삑
  playScanSound();

  // 서버 응답을 기다리는 동안에도 다음 QR을 읽을 수 있게 함
  processing = false;

  setStatus("출석 저장 중...", "");

  const callbackName = "__scanCallback_" + Date.now();
  const script = document.createElement("script");

  const cleanup = () => {
    try {
      delete window[callbackName];
    } catch (e) {}

    script.remove();
  };

  const timeout = setTimeout(() => {
    cleanup();

    setStatus(
      "서버 응답이 늦습니다. 출석로그를 확인해주세요.",
      "error"
    );
  }, 7000);

  window[callbackName] = function(result) {
    clearTimeout(timeout);
    cleanup();

    if (!result || !result.success) {
      setStatus(
        result && result.message
          ? result.message
          : "출석 처리에 실패했습니다.",
        "error"
      );
      return;
    }

    const student = result.student || {};

    setStatus(
      '<div class="student-name">' +
      esc(student.name) +
      '</div>' +
      esc(student.classroom || "") +
      ' · ' +
      esc(student.seat || "") +
      '번<br>' +
      '<strong>' +
      esc(result.message || "") +
      '</strong> · ' +
      esc(result.processedAt || ""),
      "success",
      true
    );

    if (navigator.vibrate) {
      navigator.vibrate(120);
    }
  };

  const params = new URLSearchParams({
    action: "scan",
    token: token,
    type: selectedType,
    key: SCANNER_KEY,
    callback: callbackName,
    _: String(Date.now())
  });

  script.src =
    API_URL +
    "?" +
    params.toString();

  document.body.appendChild(script);
}


  const params = new URLSearchParams({
    action: "scan",
    token: token,
    type: selectedType,
    key: SCANNER_KEY,
    callback: callbackName,
    _: String(Date.now())
  });

  script.src = API_URL + "?" + params.toString();
  document.body.appendChild(script);
}

function setStatus(text, type, html) {
  const box = document.getElementById("status");
  box.className = "status" + (type ? " " + type : "");
  if (html) box.innerHTML = text;
  else box.textContent = text;
}

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


let scanAudioCtx = null;
function playScanSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!scanAudioCtx) scanAudioCtx = new AudioCtx();
    if (scanAudioCtx.state === "suspended") scanAudioCtx.resume();
    const oscillator = scanAudioCtx.createOscillator();
    const gain = scanAudioCtx.createGain();
    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(1200, scanAudioCtx.currentTime);
    gain.gain.setValueAtTime(0.28, scanAudioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, scanAudioCtx.currentTime + 0.12);
    oscillator.connect(gain);
    gain.connect(scanAudioCtx.destination);
    oscillator.start();
    oscillator.stop(scanAudioCtx.currentTime + 0.12);
  } catch (e) {
    console.log("스캔음 재생 실패", e);
  }
}

startCamera();
</script>
</body>
</html>
