<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>통합 QR 자동 스캐너</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6fa;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif}
    .header{padding:22px 18px 28px;background:#e53935;color:#fff}
    .header h1{margin:0;font-size:22px}
    .header p{margin:7px 0 0;font-size:13px;opacity:.9}
    .content{max-width:560px;margin:-12px auto 0;padding:0 14px 28px}
    .card{margin-bottom:13px;padding:17px;border-radius:17px;background:#fff;box-shadow:0 7px 20px rgba(0,0,0,.06)}
    .type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:15px}
    .type-button{min-height:43px;border:1px solid #ddd;border-radius:11px;background:#fff;font-weight:900}
    .type-button.active{border-color:#e53935;background:#e53935;color:#fff}
    .video-wrap{position:relative;overflow:hidden;border-radius:14px;background:#111;aspect-ratio:3/4}
    video{width:100%;height:100%;object-fit:cover}
    .guide{position:absolute;left:50%;top:50%;width:68%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.23);pointer-events:none}
    .status{margin-top:12px;padding:14px;border-radius:12px;text-align:center;font-size:14px;line-height:1.5;background:#f7f8fa}
    .success{background:#eefaf1;color:#2e7d32}
    .error{background:#fff1f1;color:#c62828}
    .student-name{font-size:21px;font-weight:900}
    .camera-btn{display:none;width:100%;height:48px;margin-top:12px;border:0;border-radius:12px;background:#222;color:#fff;font-size:15px;font-weight:900}
    .small{margin-top:9px;color:#777;text-align:center;font-size:12px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <header class="header">
    <h1>통합 QR 자동 출석</h1>
    <p>QR을 화면 안에 가져다 대면 자동 처리됩니다.</p>
  </header>

  <main class="content">
    <section class="card">
      <div class="type-grid">
        <button class="type-button active" data-type="입실">입실</button>
        <button class="type-button" data-type="외출">외출</button>
        <button class="type-button" data-type="복귀">복귀</button>
        <button class="type-button" data-type="퇴실">퇴실</button>
      </div>

      <div class="video-wrap">
        <video id="video" playsinline muted></video>
        <div class="guide"></div>
      </div>

      <button id="cameraBtn" class="camera-btn" type="button">카메라 시작</button>
      <div id="status" class="status">카메라를 시작하는 중입니다.</div>
      <div class="small">스캔 성공 후 자동으로 다음 학생을 기다립니다.</div>
      <canvas id="canvas" hidden></canvas>
    </section>
  </main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzoApn9Z8PK3Gbk16yINX_5zrYf2N0uyn4TA20iZXaSmzEG0HDx8OEQRpvO1WGMgWxs/exec";
const SCANNER_KEY = "00b63e24-0f8c-4f3a-b34a-246fa64efa9692df311f-a87e-4a81-bf4c-6e31dc9d0259";

let selectedType = "입실";
let stream = null;
let scanning = false;
let processing = false;
let lastToken = "";
let lastProcessedAt = 0;

document.querySelectorAll(".type-button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".type-button").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    selectedType = btn.dataset.type;
  });
});

document.getElementById("cameraBtn").addEventListener("click", startCamera);

async function startCamera() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("이 브라우저는 자동 카메라 스캔을 지원하지 않습니다.");
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    const video = document.getElementById("video");
    video.srcObject = stream;
    await video.play();

    document.getElementById("cameraBtn").style.display = "none";
    setStatus("QR을 카메라 안에 가져다 대세요.", "");
    scanning = true;
    requestAnimationFrame(scanFrame);
  } catch (err) {
    document.getElementById("cameraBtn").style.display = "block";
    setStatus("카메라를 열 수 없습니다: " + (err.message || err.name || err), "error");
  }
}

function scanFrame() {
  if (!scanning) return;

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  if (video.readyState === video.HAVE_ENOUGH_DATA && !processing) {
    const w = video.videoWidth;
    const h = video.videoHeight;

    if (w && h) {
      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(video, 0, 0, w, h);

      const imageData = ctx.getImageData(0, 0, w, h);
      const qr = jsQR(imageData.data, w, h, { inversionAttempts: "attemptBoth" });

      if (qr && qr.data) {
        const now = Date.now();

        if (!(qr.data === lastToken && now - lastProcessedAt < 4000)) {
          processToken(qr.data);
        }
      }
    }
  }

  requestAnimationFrame(scanFrame);
}

function processToken(token) {
  processing = true;
  lastToken = token;
  lastProcessedAt = Date.now();

  setStatus("출석 처리 중...", "");

  const callbackName = "__scanCallback_" + Date.now();
  const script = document.createElement("script");

  const cleanup = () => {
    try { delete window[callbackName]; } catch(e) {}
    script.remove();
  };

  const timeout = setTimeout(() => {
    cleanup();
    processing = false;
    setStatus("서버 응답이 없습니다. 다시 시도해주세요.", "error");
  }, 10000);

  window[callbackName] = function(result) {
    clearTimeout(timeout);
    cleanup();
    processing = false;

    if (!result || !result.success) {
      setStatus(
        result && result.message
          ? result.message
          : "출석 처리에 실패했습니다.",
        "error"
      );
      return;
    }

    const s = result.student || {};

    setStatus(
      '<div class="student-name">' + esc(s.name) + '</div>' +
      esc(s.classroom || "") + ' · ' + esc(s.seat || "") + '번<br>' +
      '<strong>' + esc(result.message || "") + '</strong> · ' +
      esc(result.processedAt || ""),
      "success",
      true
    );

    if (navigator.vibrate) navigator.vibrate(160);
  };

  const params = new URLSearchParams({
    action: "scan",
    token: token,
    type: selectedType,
    key: SCANNER_KEY,
    callback: callbackName,
    _: String(Date.now())
  });

  script.src = API_URL + "?" + params.toString();
  document.body.appendChild(script);
}

function setStatus(text, type, html) {
  const box = document.getElementById("status");
  box.className = "status" + (type ? " " + type : "");

  if (html) box.innerHTML = text;
  else box.textContent = text;
}

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

startCamera();
</script>
</body>
</html>
